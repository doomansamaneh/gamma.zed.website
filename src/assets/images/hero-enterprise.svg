<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background & Depth Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1926" />
      <stop offset="100%" stop-color="#17263C" />
    </linearGradient>

    <!-- Brand Color Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0B84F3" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0B84F3" />
    </linearGradient>

    <!-- Glassmorphism Surface Gradients -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 48, 74, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 25, 38, 0.85)" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(23, 38, 60, 0.9)" />
      <stop offset="100%" stop-color="rgba(15, 25, 38, 0.95)" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern for Tech Background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(11, 132, 243, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Ambient Glow Background Spots -->
  <circle cx="650" cy="350" r="300" fill="#0B84F3" opacity="0.12" filter="url(#glow)" />
  <circle cx="250" cy="550" r="200" fill="#00f2fe" opacity="0.08" filter="url(#glow)" />

  <!-- Connecting IoT Network Lines (Background Data Mesh) -->
  <g opacity="0.3" stroke="url(#blueGrad)" stroke-width="1.5" fill="none">
    <path d="M 150 250 L 350 180 L 520 280 L 780 150 L 1020 300" />
    <path d="M 200 600 L 400 500 L 600 620 L 850 480 L 1100 550" />
    <circle cx="350" cy="180" r="4" fill="#0B84F3" />
    <circle cx="520" cy="280" r="4" fill="#00f2fe" />
    <circle cx="780" cy="150" r="4" fill="#0B84F3" />
    <circle cx="400" cy="500" r="4" fill="#00f2fe" />
    <circle cx="850" cy="480" r="4" fill="#0B84F3" />
  </g>

  <!-- ==================== 2. INDUSTRIAL ASSET & SENSOR LAYER (Left / Background Center) ==================== -->
  <g transform="translate(60, 180)" filter="url(#softShadow)">
    <!-- Asset Base Platform -->
    <ellipse cx="200" cy="420" rx="160" ry="40" fill="#0a121c" stroke="#1e304a" stroke-width="2" />
    <ellipse cx="200" cy="410" rx="140" ry="30" fill="none" stroke="#0B84F3" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" />

    <!-- Industrial Turbine / Motor Housing (Enterprise Asset) -->
    <path d="M 130 400 L 140 280 C 140 250, 260 250, 260 280 L 270 400 Z" fill="url(#cardGrad)" stroke="#223a5e" stroke-width="2" />
    
    <!-- Cooling Fins -->
    <rect x="135" y="300" width="130" height="10" rx="2" fill="#17263C" stroke="#0B84F3" stroke-width="1" opacity="0.8" />
    <rect x="135" y="325" width="130" height="10" rx="2" fill="#17263C" stroke="#0B84F3" stroke-width="1" opacity="0.8" />
    <rect x="135" y="350" width="130" height="10" rx="2" fill="#17263C" stroke="#0B84F3" stroke-width="1" opacity="0.8" />
    <rect x="135" y="375" width="130" height="10" rx="2" fill="#17263C" stroke="#0B84F3" stroke-width="1" opacity="0.8" />

    <!-- Turbine Core / Shaft -->
    <circle cx="200" cy="270" r="35" fill="#0f1926" stroke="url(#blueGrad)" stroke-width="3" />
    <circle cx="200" cy="270" r="15" fill="#0B84F3" opacity="0.5" />

    <!-- IoT Sensor Unit Mounted on Asset -->
    <g transform="translate(175, 170)">
      <rect x="0" y="0" width="50" height="50" rx="8" fill="#17263C" stroke="#00f2fe" stroke-width="2" />
      <!-- IoT Signal Waves -->
      <path d="M 25 -5 Q 35 -15, 45 -5" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
      <path d="M 25 -12 Q 40 -25, 55 -12" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
      <circle cx="25" cy="25" r="8" fill="#0B84F3" />
      <circle cx="25" cy="25" r="12" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.8">
        <animate attributeName="r" values="8;18;8" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Live Data Callout Pill (IoT Telemetry) -->
    <g transform="translate(15, 230)">
      <rect x="0" y="0" width="110" height="34" rx="17" fill="rgba(11, 132, 243, 0.15)" stroke="#0B84F3" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#00f2fe" />
      <text x="32" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">IoT: 98.4%</text>
    </g>
  </g>


  <!-- ==================== 3. ENTERPRISE DASHBOARD & ANALYTICS UI (Right / Foreground) ==================== -->
  <g transform="translate(440, 110)" filter="url(#softShadow)">
    
    <!-- Main Dashboard Window Frame -->
    <rect x="0" y="0" width="700" height="560" rx="12" fill="url(#windowGrad)" stroke="#223a5e" stroke-width="2" />
    
    <!-- Window Title Bar -->
    <path d="M 0 12 C 0 5, 5 0, 12 0 L 688 0 C 695 0, 700 5, 700 12 L 700 45 L 0 45 Z" fill="#17263C" />
    <!-- Window Controls (Mac/Enterprise style) -->
    <circle cx="25" cy="22.5" r="6" fill="#ff5f56" opacity="0.8" />
    <circle cx="45" cy="22.5" r="6" fill="#ffbd2e" opacity="0.8" />
    <circle cx="65" cy="22.5" r="6" fill="#27c93f" opacity="0.8" />
    
    <!-- Dashboard Header Title Simulation (Abstract Bars) -->
    <rect x="95" y="17" width="140" height="11" rx="5.5" fill="#38bdf8" opacity="0.8" />
    <rect x="580" y="16" width="90" height="14" rx="7" fill="rgba(11, 132, 243, 0.3)" />

    <!-- SUB-SYSTEM 1: KPI Cards Grid (Top row inside dashboard) -->
    <!-- Card 1: Availability OEE -->
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="195" height="95" rx="8" fill="url(#cardGrad)" stroke="#223a5e" stroke-width="1.5" />
      <path d="M 15 25 L 35 25" stroke="#0B84F3" stroke-width="3" stroke-linecap="round" />
      <rect x="15" y="40" width="100" height="10" rx="4" fill="#223a5e" opacity="0.5" />
      <rect x="15" y="60" width="140" height="18" rx="4" fill="#38bdf8" opacity="0.2" />
      <text x="25" y="74" fill="#00f2fe" font-family="sans-serif" font-size="14" font-weight="bold">94.8% OEE</text>
    </g>

    <!-- Card 2: Active Work Orders -->
    <g transform="translate(250, 75)">
      <rect x="0" y="0" width="195" height="95" rx="8" fill="url(#cardGrad)" stroke="#223a5e" stroke-width="1.5" />
      <path d="M 15 25 L 35 25" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <rect x="15" y="40" width="90" height="10" rx="4" fill="#223a5e" opacity="0.5" />
      <text x="15" y="74" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">1,420 Assets</text>
    </g>

    <!-- Card 3: Predictive Health Risk -->
    <g transform="translate(470, 75)">
      <rect x="0" y="0" width="195" height="95" rx="8" fill="url(#cardGrad)" stroke="#223a5e" stroke-width="1.5" />
      <path d="M 15 25 L 35 25" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" />
      <rect x="15" y="40" width="110" height="10" rx="4" fill="#223a5e" opacity="0.5" />
      <text x="15" y="74" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">Optimal State</text>
    </g>


    <!-- SUB-SYSTEM 2: Advanced Maintenance Chart & Analytics (Middle row) -->
    <g transform="translate(30, 195)">
      <rect x="0" y="0" width="430" height="220" rx="8" fill="url(#cardGrad)" stroke="#223a5e" stroke-width="1.5" />
      
      <!-- Chart Header -->
      <rect x="20" y="20" width="160" height="12" rx="4" fill="#ffffff" opacity="0.7" />
      <rect x="20" y="38" width="100" height="8" rx="3" fill="#38bdf8" opacity="0.5" />

      <!-- Grid Lines inside chart -->
      <line x1="20" y1="80" x2="410" y2="80" stroke="#223a5e" stroke-width="1" stroke-dasharray="4 4" />
      <line x1="20" y1="120" x2="410" y2="120" stroke="#223a5e" stroke-width="1" stroke-dasharray="4 4" />
      <line x1="20" y1="160" x2="410" y2="160" stroke="#223a5e" stroke-width="1" stroke-dasharray="4 4" />

      <!-- Area Chart Gradient Fill -->
      <defs>
        <linearGradient id="chartArea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0B84F3" stop-opacity="0.5" />
          <stop offset="100%" stop-color="#0B84F3" stop-opacity="0.0" />
        </linearGradient>
      </defs>
      
      <path d="M 20 170 Q 90 100, 160 130 T 300 70 T 410 50 L 410 190 L 20 190 Z" fill="url(#chartArea)" />
      
      <!-- Glowing Trend Line -->
      <path d="M 20 170 Q 90 100, 160 130 T 300 70 T 410 50" fill="none" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)" />
      
      <!-- Data Points on Chart -->
      <circle cx="160" cy="130" r="5" fill="#00f2fe" />
      <circle cx="300" cy="70" r="5" fill="#00f2fe" />
      <circle cx="410" cy="50" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    </g>


    <!-- SUB-SYSTEM 3: Multi-System Architecture / Sub-modules Status Panel (Right column) -->
    <g transform="translate(470, 195)">
      <rect x="0" y="0" width="195" height="220" rx="8" fill="url(#cardGrad)" stroke="#223a5e" stroke-width="1.5" />
      
      <rect x="20" y="20" width="110" height="12" rx="4" fill="#ffffff" opacity="0.7" />
      
      <!-- Sub-system Modules List -->
      <!-- Module 1: Inventory & Spare Parts -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="24" height="24" rx="6" fill="rgba(11, 132, 243, 0.2)" />
        <circle cx="12" cy="12" r="5" fill="#0B84F3" />
        <rect x="35" y="4" width="90" height="8" rx="3" fill="#ffffff" opacity="0.8" />
        <rect x="35" y="16" width="60" height="6" rx="2" fill="#38bdf8" opacity="0.5" />
      </g>

      <!-- Module 2: Work Order Management -->
      <g transform="translate(20, 95)">
        <rect x="0" y="0" width="24" height="24" rx="6" fill="rgba(0, 242, 254, 0.2)" />
        <circle cx="12" cy="12" r="5" fill="#00f2fe" />
        <rect x="35" y="4" width="100" height="8" rx="3" fill="#ffffff" opacity="0.8" />
        <rect x="35" y="16" width="70" height="6" rx="2" fill="#38bdf8" opacity="0.5" />
      </g>

      <!-- Module 3: Predictive IoT Hub -->
      <g transform="translate(20, 140)">
        <rect x="0" y="0" width="24" height="24" rx="6" fill="rgba(11, 132, 243, 0.2)" />
        <circle cx="12" cy="12" r="5" fill="#38bdf8" />
        <rect x="35" y="4" width="80" height="8" rx="3" fill="#ffffff" opacity="0.8" />
        <rect x="35" y="16" width="50" height="6" rx="2" fill="#38bdf8" opacity="0.5" />
      </g>
    </g>


    <!-- SUB-SYSTEM 4: Bottom Enterprise Status Bar (SAP/Siemens style) -->
    <g transform="translate(30, 435)">
      <rect x="0" y="0" width="635" height="95" rx="8" fill="url(#cardGrad)" stroke="#223a5e" stroke-width="1.5" />
      
      <!-- Progress Bar / System Load -->
      <text x="25" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" opacity="0.9">Enterprise Resource Synchronization</text>
      
      <rect x="25" y="48" width="585" height="8" rx="4" fill="#0f1926" />
      <rect x="25" y="48" width="460" height="8" rx="4" fill="url(#blueGrad)" />
      
      <!-- Status Tags -->
      <circle cx="27" cy="74" r="4" fill="#27c93f" />
      <text x="38" y="78" fill="#38bdf8" font-family="sans-serif" font-size="11">Cloud Cluster US-EAST-1 Active</text>

      <circle cx="230" cy="74" r="4" fill="#27c93f" />
      <text x="241" y="78" fill="#38bdf8" font-family="sans-serif" font-size="11">SAP / ERP Connector: Online</text>
    </g>

  </g>

  <!-- ==================== 4. FLOATING ENTERPRISE BADGE / ACCENT ==================== -->
  <g transform="translate(80, 80)" filter="url(#glow)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#17263C" stroke="url(#blueGrad)" stroke-width="2" />
    <!-- Stylized Z letter or Enterprise Node Icon -->
    <path d="M 22 22 L 48 22 L 22 48 L 48 48" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
